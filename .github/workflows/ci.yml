name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    services:
      # A real Prometheus, so the integration tests are not mocked away. Its
      # default config scrapes itself, which is all these tests need.
      prometheus:
        image: prom/prometheus:v3.14.0
        ports:
          - 9099:9090
    env:
      VEDAVID_TEST_PROMETHEUS: http://127.0.0.1:9099
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The proto build script shells out to protoc; the runner image has none.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Ready is not the same as scraped, and the tests assert on samples.
      - name: Wait for the first scrape
        run: |
          for _ in $(seq 1 40); do
            if curl -sf "$VEDAVID_TEST_PROMETHEUS/api/v1/query?query=up" | grep -q '"value"'; then
              exit 0
            fi
            sleep 2
          done
          echo "prometheus produced no samples" >&2
          exit 1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
